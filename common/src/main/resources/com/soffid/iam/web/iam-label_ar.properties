issues.disconnected-system.definition=يتم إنشاء هذه المشكلة عندما يكتشف خادم Sync أن بعض النظام المستهدف غير متصل بالإنترنت
issues.discovered-host.definition=يتم إنشاء هذه المشكلة عندما يكتشف Sync Server مضيفًا جديدًا في الشبكة. يحدث هذا فقط بعد تنفيذ عملية اكتشاف الشبكة.
issues.discovered-system.definition=يتم إنشاء هذه المشكلة عندما يكتشف Sync Server نظامًا جديدًا في مضيف. يحدث هذا فقط بعد تنفيذ عملية اكتشاف الشبكة.
issues.duplicated-user.definition=يكتشف النظام أن هناك مستخدمين مكررين ، أو عندما يتم إنشاء المهمة يدويًا من إدارة المستخدم.
issues.enabled-account-on-disabled-user.definition=يتم إنشاء هذه المشكلة عند اكتشاف حساب ممكّن على مستخدم معاق. قد يحدث هذا بعد تنفيذ عملية المصالحة.
issues.failed-job.definition=يتم إنشاء هذه المشكلة عندما يكتشف النظام فشل الوظيفة. قد يحدث هذا عن طريق تشغيل أي مهمة مجدولة.
issues.global-failed-login.definition=يتم إنشاء هذه المشكلة عندما يتجاوز عدد فشل بدء الجلسة عتبة 0.8.
issues.integration-errors.definition=يتم إنشاء هذه المشكلة عندما يكتشف Sync Server خطأ تكامل بين Soffid ونظام نهائي. يمكنك التحقق من المهمة في المراقبة والتقارير.
issues.lockAccount=تأكيد قفل الحساب %s عند %s
issues.locked-account.definition=يتم إنشاء هذه المشكلة عند حظر حساب لتجاوز الحد الأقصى لعدد محاولات تسجيل الدخول. يمكنك تكوين قفل الخاصية بعد الإخفاقات في إعدادات سياسات كلمة المرور. حتى لو تم قفله مؤقتًا ، سيتم إنشاء الحادث.
issues.login-different-country.definition=يتم إنشاء هذه المشكلة عندما يكتشف Soffid تسجيل دخول جديد من بلد مختلف. إنه يعمل فقط مع مزود الهوية ومن الضروري تحديث قاعدة بيانات تحديد الموقع الجغرافي.
issues.login-from-new-device.definition=يتم إنشاء هذه المشكلة عندما يكتشف Soffid تسجيل دخول جديد من جهاز جديد. إنه يعمل فقط مع مزود الهوية.
issues.login-not-recognized.definition=يتم إنشاء هذه المشكلة عندما يكتشف SoffID تسجيل دخول غير معروف (لا يوجد مستخدم أو مستخدم معاق) في وحدة التحكم Soffid أو في Soffid كمزود هوية.
issues.noAccount=لا يوجد حساب لفتحه
issues.noHost=لا يوجد مُضيف لقفله
issues.noUser=لا يوجد مُستخدم لتعطيله
issues.otp-failures.definition=يتم إنشاء هذه المشكلة عندما يتم حظر OTP لتجاوز عدد المحاولات. تم حظره حاليًا مع 10 محاولات غير ناجحة.
issues.pam-violation.definition=يتم إنشاء هذه المشكلة عندما يتم انتهاك أي من قواعد PAM. يمكنك تحديد قواعد PAM وسياسات PAM. ضع في اعتبارك أنه يجب عليك التحقق من خيار "المشكلة المفتوحة" في سياسات PAM التي ترغب في التحكم فيها.
issues.password-changed.definition=يتم إنشاء هذه المشكلة عند اكتشاف تغيير كلمة المرور. تأتي هذه التغييرات من النظام النهائي (Active Directory أو Soffid OpenLDAP) وتم إخطار Soffid. لا يتم إنشاء المشكلة إذا كان المشغل أو البرنامج النصي الذي يغير كلمة المرور في Soffid.
issues.permissions-granted.definition=يتم إنشاء هذه المشكلة عندما يتم اكتشاف أن الأذونات قد أعطيت للمستخدم على النظام النهائي. قد يحدث هذا بعد تنفيذ عملية المصالحة.
issues.risk-increase.definition=يتم إنشاء هذه المشكلة عندما يتم اكتشاف أن الأذونات قد أعطيت للمستخدم على النظام النهائي. قد يحدث هذا بعد تنفيذ عملية المصالحة.
issues.robot-login.definition=يتم إنشاء هذه المشكلة عندما يتم اكتشاف أنه يتم اكتشاف أن شخصًا لم يتجاوز Captcha يحاول تسجيل الدخول إلى مزود الهوية.
issues.security-exception.definition=يتم إنشاء هذه المشكلة عند حدوث وصول غير مصرح به إلى وحدة التحكم عبر خدمة الويب أو وحدة التحكم في المسؤول.
