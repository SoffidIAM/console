tools.disable-accounts.defaultSubject=ملاحظة هامة حول حساب #{name}
tools.disable-accounts.filter=تصفية الحسابات
tools.disable-accounts.introduction=ربما توجد بعض الحسابات التي لم تعد مستخدمة. باستخدام هذه الأداة، ستتمكن من تحديدها واتخاذ الإجراءات اللازمة بشأنها. تتكون العملية من خطوتين: 1. تصفية مجموعة الحسابات المراد تحليلها. 2. تحديد الإجراءات المطلوب تنفيذها على تلك الحسابات. عادةً ما تُستخدم هذه الأداة في البداية لمجموعة فرعية فقط من حساباتك. على سبيل المثال، يمكنك إرسال رسالة عند انتهاء صلاحية كلمة المرور، أو تعطيل الحساب عند عدم تسجيل الدخول خلال آخر 90 يومًا، أو إزالته تمامًا عند تعطيل الحساب لمدة 30 يومًا.
