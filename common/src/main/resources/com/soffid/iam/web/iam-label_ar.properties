tutorial.breadscrumsOptionsMessageBox=لا تضل طريقك أبدًا. استخدم مؤشر المسار هذا للتنقل عبر الصفحات والسجلات.
tutorial.end=الآن، سترشدك العجلة أسفل هذا المربع خلال الخطوات الرئيسية اللازمة لتكوين Soffid IAM بشكل صحيح: • حوكمة الهوية لإدارة دورة حياة الهويات • تُحدد إدارة الوصول المستخدمين الذين يصلون إلى التطبيقات، بما في ذلك المصادقة متعددة العوامل • تُتابع إدارة الوصول المُتميز استخدام حسابات إدارة الخدمة والنظام والوصول إليها • مخاطر الهوية والامتثال
tutorial.helpOptionsMessageBox=انقر هنا للوصول إلى قائمة "المساعدة". ستُرشدك إلى وثائق Soffid المُحدثة دائمًا في السحابة.
tutorial.mainNavigationMessageBox=هناك ثلاث طرق للوصول إلى خيار القائمة الصحيح: • استخدم الأيقونات المعروضة على الشاشة للتنقل عبر القوائم والخيارات • انقر على رمز القائمة المُشار إليه بالسهم • استخدم شريط البحث
tutorial.searchOptionsMessageBox=ابحث عن أي شيء تحتاجه باستخدام ميزة البحث السريع. يُعد شريط البحث أداة بحث متعددة الأغراض، حيث يبحث إما عن خيارات القائمة أو الهويات أو أنظمة المعلومات أو مجموعات وحدات الأعمال. استخدمه للوصول إلى بياناتك بسرعة.
