wizard-oracle.onlyOne=الرجاء إدخال مُعرّف قاعدة البيانات أو الخدمة، ولكن ليس كليهما. سيقوم هذا المعالج بتكوين قواعد التحكم في الوصول لوحدة تحكم Soffid. من الآن فصاعدًا، سيُطلب إدخال كلمة مرور لمرة واحدة (OTP) للوصول إلى مخزن كلمات المرور أو قائمة التطبيقات. كما سيُطلب التحقق من صحة كلمة المرور لمرة واحدة (OTP) لإزالة أو تسجيل أجهزة جديدة. استثناءً، سيتمكن المستخدمون من تسجيل أجهزة OTP في حال عدم وجود جهاز نشط آخر.
