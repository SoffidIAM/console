tools.redundant.filter=تصفية الأدوار
tools.redundant.introduction=يمكن أن يحتوي ملف التعريف عالي المستوى على أذونات تطبيق أو يمنحها. من ناحية أخرى، يمكن أن يحتوي ملف التعريف منخفض المستوى على أذونات تطبيق أو يمنحها. يُشار إليها جميعًا عمومًا بالأدوار. قد يكون بعض المستخدمين قد مُنحوا ملفات تعريف عالية المستوى وأذونات تطبيق أو أذونات منخفضة المستوى. في هذه الحالة، يمكن إزالة الأدوار منخفضة المستوى من قاعدة بيانات Soffid، حيث يتم توريثها من خلال قواعد توريث الأدوار. تحدد هذه الأداة أي أدوار منخفضة المستوى مُنحت للمستخدمين في نفس الوقت الذي يُمنح فيه صاحب الدور عالي المستوى، وتزيلها.
tools.redundant.introduction2=خصص الفلتر لتطبيقه على الصلاحيات منخفضة المستوى لتنظيف البيانات.
