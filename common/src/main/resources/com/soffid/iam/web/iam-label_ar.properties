tools.disable-users.filter=تصفية المستخدمين
tools.disable-users.introduction=ربما يوجد بعض المستخدمين الذين لا يحتاجون إلى الوصول إلى أي نظام معلومات. باستخدام هذه الأداة، ستتمكن من تحديد هويتهم واتخاذ الإجراءات اللازمة بشأنهم. تتكون العملية من خطوتين: 1. تصفية مجموعة المستخدمين المراد تحليلها. 2. تحديد الإجراءات المطلوب تنفيذها على هؤلاء المستخدمين. عادةً ما تُستخدم هذه الأداة في البداية لمجموعة فرعية فقط من المستخدمين. على سبيل المثال، يمكنك إرسال رسالة عند انتهاء صلاحية كلمة المرور، أو تعطيل المستخدم عند عدم تسجيل الدخول خلال آخر 90 يومًا، أو إزالة حساباته تمامًا عند تعطيل هويته لمدة 30 يومًا.
