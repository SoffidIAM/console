issues.account-created.definition=Este incidente de seguridad se crea cuando el Sync Server detecta la creación de una nueva cuenta. Esto puede ocurrir después de que se haya ejecutado el proceso de reconciliación.
issues.accountAlreadyLocked=La cuenta %s ya está bloqueada
issues.accountLocked=La cuenta %s ha sido bloqueada
issues.accountNotLocked=La cuenta %s no está bloqueada
issues.accountUnlocked=La cuenta %s ha sido desbloqueada
issues.cannotMergeMultiple=No se pueden fusionar varios incidentes
issues.disabledHosts=El host %s está desactivado
issues.disabledUsers=El usuario %s está deshabilitado
issues.disableHost=Confirmar para bloquear host %s
issues.disableUser=Confirmar para desactivar usuario %s
issues.disconnected-system.definition=Este incidente de seguridad  se crea cuando el Sync Server detecta que algún sistema de destino está desconectado
issues.discovered-host.definition=Este incidente de seguridad  se crea cuando el servidor de sincronización detecta un nuevo host en la red. Esto solo ocurre después de que se haya ejecutado el proceso de detección de red.
issues.discovered-system.definition=Este incidente de seguridad  se crea cuando el Sync Server detecta un nuevo sistema en un host. Esto solo ocurre después de que se haya ejecutado el proceso Network Discovery.
issues.duplicated-user.definition=Esta incidente de seguridad se crea cuando el sistema detecta que hay usuarios duplicados, o cuando la tarea se genera manualmente desde la gestión de usuarios.
issues.enabled-account-on-disabled-user.definition=Este incidente de seguridad se crea cuando se detecta una cuenta habilitada en un usuario deshabilitado. Esto puede ocurrir después de que se haya ejecutado el proceso de reconciliación.
issues.failed-job.definition=Este problema se crea cuando el sistema detecta fallos en las tareas. Esto puede ocurrir al ejecutar cualquier tarea programada.
issues.global-failed-login.definition=Este incidente de seguridad se crea cuando el número de fallos de inicio de sesión supera el umbral de 0,8.
issues.integration-errors.definition=Este incidente de seguridad se crea cuando el Sync Server detecta un error de integración entre Soffid y un sistema final. Puede comprobar la opción de menú Monitorización e Informes.
issues.lockAccount=Confirmar para bloquear la cuenta %s en %s
issues.locked-account.definition=Este incidente de seguridad se crea cuando una cuenta ha sido bloqueada por exceder el número máximo de intentos de inicio de sesión. Puede configurar la propiedad Bloquear tras fallos en la configuración de Políticas de contraseñas. Aunque se bloquee temporalmente, se generará la incidencia.
issues.login-different-country.definition=Este incidente de seguridad se crea cuando Soffid detecta un nuevo inicio de sesión desde un país diferente. Solo funciona con el proveedor de identidades y es necesario tener actualizada la base de datos de geolocalización.
issues.login-from-new-device.definition=Este incidente de seguridad se crea cuando Soffid detecta un nuevo inicio de sesión desde un nuevo dispositivo. Solo funciona con el Identity Provider
issues.login-not-recognized.definition=Este incidente de seguridad se crea cuando Soffid detecta un inicio de sesión no reconocido (usuario deshabilitado o usuario no existente) en la consola de Soffid o en Soffid como Identity Provider.
issues.noAccount=No hay ninguna cuenta para desbloquear
issues.noHost=No hay host para bloquear
issues.noUser=No hay ningún usuario para desactivar
issues.otp-failures.definition=Este incidente de seguridad se crea cuando una OTP se bloquea por exceder el número de intentos. Actualmente se bloquea con 10 intentos fallidos.
issues.pam-violation.definition=Este  incidente de seguridad se crea cuando se infringe alguna de las reglas PAM. Puede definir las reglas y políticas PAM en la consola de Soffid. Tenga en cuenta que debe marcar la opción "Abrir incidencia" en las políticas PAM que desee controlar.
issues.password-changed.definition=Este incidente de seguridad se crea cuando se detecta un cambio de contraseña. Estos cambios provienen del sistema final (Active Directory o Soffid OpenLDAP) y Soffid ha sido notificado. La incidencia no se crea si es el operador o un script el que cambia la contraseña en Soffid.
issues.permissions-granted.definition=Este incidente de seguridad se crea cuando se detecta que se han dado permisos a un usuario en el sistema final. Esto puede ocurrir después de que se haya ejecutado el proceso de reconciliación.
issues.risk-increase.definition=Este incidente de seguridad se crea cuando se detecta que se han dado permisos a un usuario en el sistema final. Esto puede ocurrir después de que se haya ejecutado el proceso de reconciliación.
issues.robot-login.definition=Este incidente de seguridad se crea cuando se detecta que alguien que no ha superado el CAPTCHA está intentando iniciar sesión en el proveedor de identidades.
issues.security-exception.definition=Este incidente de seguridad se crea cuando se produce un acceso no autorizado a la consola a través de WebService o de la consola de administración.
