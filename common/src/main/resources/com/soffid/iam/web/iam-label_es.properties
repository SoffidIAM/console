tutorial.breadscrumsOptionsMessageBox=Nunca te pierdas de tu camino. !! Use este indicador de ruta para navegar a través de páginas y registros.
tutorial.end=Ahora, la rueda debajo de este cuadro lo guiará a través de los principales pasos necesarios para configurar correctamente Soffid IAM: !! • ¡Gobierno de identidad para gestionar el ciclo de vida de las identidades! • ¡La gestión de acceso identifica a los usuarios que acceden a las aplicaciones, incluida la autenticación multifactor! • ¡La administración de acceso privilegiado realiza un seguimiento del uso y el acceso de las cuentas de administración de servicios y sistemas! • Riesgo de identidad y cumplimiento !!
tutorial.helpOptionsMessageBox=Haga clic aquí para acceder al menú Ayuda. Le indicará la documentación de Soffid siempre actualizada en la nube.
tutorial.mainNavigationMessageBox=Hay tres formas de llegar a la opción de menú correcta: • ¡Utilice los iconos que se muestran en la pantalla para navegar por los menús y las opciones! • ¡Haga clic en el icono de menú señalado por la flecha! • ¡Usa la barra de búsqueda!
tutorial.searchOptionsMessageBox=Busque lo que necesite con la función de búsqueda rápida. !! La barra de búsqueda es un buscador multipropósito, que buscará opciones de menú, identidades, sistemas de información o grupos de unidades de negocios. !! Úselo para acceder rápidamente a sus datos.
