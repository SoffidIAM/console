wizard-vault.selectAccountsFinished=Le coffre-fort de mots de passe a été configuré. Les utilisateurs du rôle SOFFID_ADMIN sont les propriétaires des comptes. Les utilisateurs du rôle SOFFID_VAULT_MGR peuvent interroger et définir le mot de passe du compte. Les utilisateurs du rôle SOFFID_VAULT_USER peuvent utiliser les comptes.
