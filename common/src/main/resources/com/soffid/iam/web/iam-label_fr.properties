tools.disable-users.criteria0=Nombre de jours depuis la dernière connexion
tools.disable-users.criteria1=Nombre de jours depuis l'expiration du mot de passe
tools.disable-users.defaultSubject=Avis important concernant l'identité de #{fullName}
tools.disable-users.filter=Filtrer les utilisateurs
tools.disable-users.introduction=Certains utilisateurs n'ont probablement pas besoin d'accéder à un système d'information. Cet outil vous permettra de les identifier et d'agir en conséquence. Le processus se déroule en deux étapes : 1. Filtrer l'ensemble des utilisateurs à analyser. 2. Sélectionner les actions à effectuer sur ces utilisateurs. Il est courant d'utiliser initialement cet outil uniquement pour un sous-ensemble de vos utilisateurs. Par exemple, vous pouvez envoyer un message lorsque le mot de passe approche de sa date d'expiration, désactiver l'utilisateur lorsqu'aucune connexion n'a été effectuée au cours des 90 derniers jours ou supprimer complètement ses comptes lorsque son identité a été désactivée pendant 30 jours.
tools.disable-users.introduction2=Personnaliser le filtre pour sélectionner les utilisateurs à désactiver
tools.disable-users.parameter=Paramètre
tools.disable-users.selectaction=Sélectionner les critères et l'action à effectuer avant de continuer
tools.disable-users.sendTo=Envoyer à
tools.disable-users.subject=Objet
tools.disable-users.warning.1=Avertissement : Cette action sera appliquée aux utilisateurs dont le mot de passe n'a pas encore expiré.
tools.disable-users.warning.2=Désolé, vous devez définir une valeur positive pour le nombre de jours depuis la dernière connexion.
tools.processing=Traitement
tools.redundant.filter=Filtrer les rôles
tools.redundant.introduction=Un profil de haut niveau peut contenir ou accorder des autorisations d'application. À l'inverse, les autorisations d'application peuvent contenir ou accorder des autorisations de bas niveau. Ces autorisations sont généralement appelées rôles. Certains utilisateurs peuvent avoir reçu à la fois des profils de haut niveau et des autorisations d'application, ou des autorisations de bas niveau. Dans ce cas, les rôles de bas niveau peuvent être supprimés de la base de données Soffid, car ils sont hérités via les règles d'héritage de rôles. Cet outil identifie les rôles de bas niveau accordés aux utilisateurs en même temps que le rôle de haut niveau de leur propriétaire et les supprime.
tools.redundant.introduction2=Personnalisez le filtre à appliquer aux autorisations de bas niveau pour nettoyer.
tools.redundant.preparation=Introduction
tools.redundant.preview=Aperçu des résultats
tutorial=Compte non géré
tutorial.breadscrumsOptionsMessageBox=Ne vous perdez jamais. Utilisez cet indicateur de chemin pour naviguer entre les pages et les registres.
tutorial.end=La roue située sous cet encadré vous guidera à travers les principales étapes nécessaires à la configuration correcte de Soffid IAM : • Gouvernance des identités pour gérer le cycle de vie des identités ; • Gestion des accès pour identifier les utilisateurs accédant aux applications, y compris l'authentification multifacteur ; • Gestion des accès privilégiés pour suivre l'utilisation et l'accès aux comptes de gestion des services et des systèmes ; • Risques liés aux identités et conformité
tutorial.helpOptionsMessageBox=Cliquez ici pour accéder au menu Aide. Il vous redirigera vers la documentation Soffid toujours à jour dans le cloud.
tutorial.mainNavigationMessageBox=Trois méthodes permettent d'accéder à l'option de menu souhaitée : • Utilisez les icônes affichées à l'écran pour naviguer dans les menus et les options ; • Cliquez sur l'icône de menu pointée par la flèche ; • Utilisez la barre de recherche.
tutorial.searchOptionsMessageBox=Recherchez ce dont vous avez besoin grâce à la fonction de recherche rapide. La barre de recherche est un outil polyvalent qui recherche des options de menu, des identités, des systèmes d'information ou des groupes d'unités commerciales. Utilisez-la pour accéder rapidement à vos données.
