tools.disable-accounts.defaultSubject=Avis important concernant le compte #{name}
tools.disable-accounts.filter=Filtrer les comptes
tools.disable-accounts.introduction=Certains comptes ne sont probablement plus utilisés. Cet outil vous permettra de les identifier et d'agir en conséquence. Le processus se déroule en deux étapes : 1. Filtrer l'ensemble des comptes à analyser. 2. Sélectionner les actions à effectuer sur ces comptes. Il est courant d'utiliser initialement cet outil uniquement pour certains de vos comptes. Par exemple, vous pouvez envoyer un message lorsque le mot de passe arrive à expiration, désactiver le compte si aucune connexion n'a été effectuée au cours des 90 derniers jours ou le supprimer complètement après 30 jours de désactivation.
