issues.account-created.definition=Ce problème est créé lorsque le serveur Sync détecte lorsqu'un nouveau compte est créé. Cela peut se produire après l'exécution du processus de réconciliation
issues.accountAlreadyLocked=Le compte %s est déjà verrouillé
issues.accountLocked=Le compte %s a été verrouillé
issues.accountNotLocked=Le compte %s n'est pas verrouillé
issues.accountUnlocked=Le compte %s a été déverrouillé
issues.cannotMergeMultiple=Impossible de fusionner plusieurs tickets en bloc
issues.disableHost=Confirmer le verrouillage de l'hôte %s
issues.disableUser=Confirmer la désactivation de l'utilisateur %s
issues.disabledHosts=L'hôte %s est désactivé
issues.disabledUsers=L'utilisateur %s est désactivé
issues.disconnected-system.definition=Ce problème est créé lorsque le serveur Sync détecte qu'un système cible est hors ligne
issues.discovered-host.definition=Ce problème est créé lorsque le serveur Sync détecte un nouvel hôte dans le réseau. Cela ne se produit qu'après que le processus de découverte de réseau a été exécuté.
issues.discovered-system.definition=Ce problème est créé lorsque le serveur Sync détecte un nouveau système dans un hôte. Cela ne se produit qu'après que le processus de découverte de réseau a été exécuté.
issues.duplicated-user.definition=Le système détecte qu'il existe des utilisateurs en double ou lorsque la tâche est générée manuellement à partir de la gestion des utilisateurs.
issues.enabled-account-on-disabled-user.definition=Ce problème est créé lorsqu'un compte activé est détecté sur un utilisateur désactivé. Cela peut se produire après l'exécution du processus de réconciliation.
issues.failed-job.definition=Ce problème est créé lorsque le système détecte les défaillances de l'emploi. Cela peut se produire en exécutant n'importe quelle tâche planifiée.
issues.global-failed-login.definition=Ce problème est créé lorsque le nombre d'échecs de démarrage de session dépasse le seuil de 0,8.
issues.integration-errors.definition=Ce problème est créé lorsque le serveur Sync détecte une erreur d'intégration entre Soffid et un système final. Vous pouvez vérifier la tâche dans la surveillance et les rapports.
issues.lockAccount=Confirmer le verrouillage du compte %s à %s
issues.locked-account.definition=Ce problème est créé lorsqu'un compte a été bloqué pour dépasser le nombre maximum de tentatives de connexion. Vous pouvez configurer le verrouillage de la propriété après échec dans les paramètres des politiques de mot de passe. Même s'il est temporairement verrouillé, l'incident sera généré.
issues.login-different-country.definition=Ce problème est créé lorsque Soffid détecte une nouvelle connexion à partir d'un autre pays. Il ne fonctionne qu'avec le fournisseur d'identité et il est nécessaire de mettre à jour la base de données de géolocalisation.
issues.login-from-new-device.definition=Ce problème est créé lorsque Soffid détecte une nouvelle connexion à partir d'un nouvel appareil. Cela ne fonctionne qu'avec le fournisseur d'identité.
issues.login-not-recognized.definition=Ce problème est créé lorsque Soffid détecte une connexion non reconnue (l'utilisateur ou l'utilisateur désactivé n'existe pas) dans la console Soffid ou en soffide en tant que fournisseur d'identité.
issues.noAccount=Aucun compte à déverrouiller
issues.noHost=Il n'y a aucun hôte à verrouiller
issues.noUser=Il n'y a aucun utilisateur à désactiver
issues.otp-failures.definition=Ce problème est créé lorsqu'un OTP est bloqué pour dépasser le nombre de tentatives. Actuellement bloqué avec 10 tentatives infructueuses.
issues.pam-violation.definition=Ce problème est créé lorsque l'une des règles du PAM est violée. Vous pouvez définir les règles du PAM et les politiques PAM. Gardez à l'esprit que vous devez vérifier l'option "Open Issue" dans les politiques PAM que vous souhaitez contrôler.
issues.password-changed.definition=Ce problème est créé lorsqu'un changement de mot de passe est détecté. Ces changements proviennent du système final (Active Directory ou Soffid OpenLDAP) et Soffid a été informé. Le problème n'est pas créé s'il s'agit de l'opérateur ou d'un script qui modifie le mot de passe en soffide.
issues.permissions-granted.definition=Ce problème est créé lorsqu'il est détecté que des autorisations ont été accordées à un utilisateur sur le système d'extrémité. Cela peut se produire après l'exécution du processus de réconciliation.
issues.risk-increase.definition=Ce problème est créé lorsqu'il est détecté que des autorisations ont été accordées à un utilisateur sur le système d'extrémité. Cela peut se produire après l'exécution du processus de réconciliation.
issues.robot-login.definition=Ce problème est créé lorsqu'il est détecté est détecté que quelqu'un qui n'a pas réussi le captcha essaie de se connecter au fournisseur d'identité.
issues.security-exception.definition=Ce problème est créé lorsque l'accès non autorisé à la console via le service Web ou la console d'administration se produit.
