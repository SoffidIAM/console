wizard-sod.explanation=Dans l'éditeur de règles de séparation des tâches, vous pouvez créer des règles pour détecter les attributions de rôles à risque. Ces règles peuvent inclure un ou plusieurs rôles d'un ou plusieurs systèmes. Cliquez sur OK pour accéder à l'éditeur de règles de séparation des tâches.
