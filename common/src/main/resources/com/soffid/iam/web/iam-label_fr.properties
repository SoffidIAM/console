wizard-pam-otp.explanation=Cet assistant va configurer les règles de contrôle d'accès pour la console Soffid. Désormais, un mot de passe à usage unique (OTP) sera requis pour accéder au coffre-fort de mots de passe ou au menu des applications. Une validation OTP sera également requise pour supprimer ou enregistrer de nouveaux appareils OTP. Exceptionnellement, les utilisateurs pourront enregistrer des appareils OTP s'il n'y a pas d'autre appareil actif.
