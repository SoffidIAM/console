tools.disable-users.filter=Filtrare gli utenti
tools.disable-users.introduction=Probabilmente ci sono alcuni utenti che non hanno bisogno di accedere ad alcun sistema informativo. Utilizzando questo strumento sarai in grado di identificarli e di intervenire. Il processo è in due fasi: 1. Filtra l'universo di utenti da analizzare. 2. Seleziona le azioni da eseguire su quegli utenti. Di solito, inizialmente, questo strumento viene utilizzato solo per un sottoinsieme di utenti. Ad esempio, puoi inviare un messaggio quando la password sta per scadere, disabilitare l'utente quando non è stato effettuato alcun accesso negli ultimi 90 giorni o rimuovere completamente i suoi account quando l'identità è stata disabilitata per 30 giorni.
