tools.disable-accounts.defaultSubject=Avviso importante sull'account #{name}
tools.disable-accounts.filter=Filtra account
tools.disable-accounts.introduction=Probabilmente ci sono alcuni account che non vengono più utilizzati. Utilizzando questo strumento sarai in grado di identificarli e intervenire. Il processo è in due fasi: 1. Filtra l'universo di account da analizzare. 2. Seleziona le azioni da eseguire su tali account. Di solito, inizialmente, questo strumento viene utilizzato solo per un sottoinsieme degli account. Ad esempio, puoi inviare un messaggio quando la password sta per scadere, disattivare l'account quando non è stato effettuato alcun accesso negli ultimi 90 giorni o rimuoverlo completamente quando l'account è stato disattivato per 30 giorni.
