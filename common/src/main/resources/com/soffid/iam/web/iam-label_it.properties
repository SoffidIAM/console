tools.disable-users.sendTo=Invia a
tools.disable-users.subject=Oggetto
tools.disable-users.warning.1=Avviso. Questa azione verrà applicata agli utenti la cui password non è ancora scaduta.
tools.disable-users.warning.2=Spiacenti, è necessario impostare un valore positivo per i giorni dall'ultimo accesso.
