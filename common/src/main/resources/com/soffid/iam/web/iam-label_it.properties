tools.redundant.filter=Ruoli filtro
tools.redundant.introduction=Un profilo di alto livello può contenere o concedere autorizzazioni per l'applicazione. D'altro canto, le autorizzazioni per l'applicazione possono contenere o concedere autorizzazioni di basso livello. Tutti questi sono generalmente definiti ruoli. Ad alcuni utenti potrebbero essere stati concessi sia profili di alto livello che autorizzazioni per le applicazioni o autorizzazioni di basso livello. In tal caso, i ruoli di basso livello possono essere rimossi dal database Soffid, poiché vengono ereditati tramite regole di ereditarietà dei ruoli. Questo strumento identifica tutti i ruoli di basso livello concessi agli utenti contemporaneamente al ruolo di alto livello del proprietario e li rimuove.
tools.redundant.introduction2=Personalizza il filtro da applicare alle autorizzazioni di basso livello per ripulire
