tutorial.breadscrumsOptionsMessageBox=Non perderti mai di vista. Utilizza questo indicatore di percorso per navigare tra pagine e registri.
tutorial.end=Ora, la rotellina sotto questa casella ti guiderà attraverso i passaggi principali necessari per configurare correttamente Soffid IAM: • Governance delle identità per gestire il ciclo di vita delle identità • Gestione degli accessi: identifica gli utenti che accedono alle applicazioni, inclusa l'autenticazione a più fattori • Gestione degli accessi privilegiati: tiene traccia dell'utilizzo e dell'accesso degli account di gestione dei servizi e dei sistemi • Rischio e conformità delle identità
tutorial.helpOptionsMessageBox=Clicca qui per accedere al menu Aiuto. Ti indirizzerà alla documentazione Soffid sempre aggiornata nel cloud. Ci sono tre modi per raggiungere l'opzione di menu corretta: • Utilizzare le icone visualizzate sullo schermo per navigare tra menu e opzioni • Fare clic sull'icona del menu indicata dalla freccia • Utilizzare la barra di ricerca
tutorial.mainNavigationMessageBox=Cerca tutto ciò di cui hai bisogno con la funzione di ricerca rapida. La barra di ricerca è uno strumento multiuso, che consente di cercare opzioni di menu, identità, sistemi informativi o gruppi di unità aziendali. Utilizzala per raggiungere rapidamente i tuoi dati.
tutorial.searchOptionsMessageBox=Cerca ciò di cui hai bisogno con la funzione di ricerca rapida. La barra di ricerca è uno strumento multiuso, che consente di cercare opzioni di menu, identità, sistemi informativi o gruppi di unità aziendali. Utilizzalo per trovare rapidamente i tuoi dati.
