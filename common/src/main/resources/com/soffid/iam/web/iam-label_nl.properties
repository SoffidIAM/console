tutorial=Onbeheerd account
tutorial.breadscrumsOptionsMessageBox=Verlies nooit meer uw pad. Gebruik deze padindicator om door pagina's en registers te navigeren.
tutorial.end=Het wiel onder dit vak leidt u door de belangrijkste stappen die nodig zijn om Soffid IAM correct te configureren:    \u2022 Identiteitsbeheer om de levenscyclus van identiteiten te beheren    \u2022 Toegangsbeheer identificeert uw gebruikers die toegang hebben tot applicaties, inclusief multi-factor authenticatie    \u2022 Beheer van bevoorrechte toegang houdt het gebruik en de toegang van service- en systeembeheeraccounts bij    \u2022 Identiteitsrisico en compliance
tutorial.helpOptionsMessageBox=Klik hier om het Help-menu te openen.  Hier vindt u de altijd actuele Soffid-documentatie in de cloud.
tutorial.mainNavigationMessageBox=Er zijn drie manieren om de juiste menuoptie te bereiken:    \u2022 Gebruik de pictogrammen op het scherm om door menu's en opties te navigeren    \u2022 Klik op het menupictogram met de pijl   \u2022 Gebruik de zoekbalk
tutorial.searchOptionsMessageBox=Zoek wat je nodig hebt met de snelle zoekfunctie.    De zoekbalk is een multifunctionele zoekfunctie waarmee je kunt zoeken naar menuopties, identiteiten, informatiesystemen of bedrijfseenheidsgroepen.    Gebruik de zoekbalk om snel je gegevens te vinden.
