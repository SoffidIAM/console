tools.disable-users.filter=Gebruikers filteren
tools.disable-users.introduction=Waarschijnlijk zijn er gebruikers die geen toegang tot een informatiesysteem nodig hebben. Met deze tool kunt u ze identificeren en actie ondernemen.   Het proces bestaat uit twee stappen:    1. Filter de gebruikers die u wilt analyseren.    2. Selecteer de acties die u voor die gebruikers wilt uitvoeren.    Het is gebruikelijk om deze tool in eerste instantie alleen voor een subset van uw gebruikers te gebruiken.    U kunt bijvoorbeeld een bericht sturen wanneer het wachtwoord de vervaldatum nadert, de gebruiker uitschakelen wanneer er in de afgelopen 90 dagen niet is ingelogd, of de accounts volledig verwijderen wanneer de identiteit 30 dagen is uitgeschakeld.
