tools.redundant.filter=Filterrollen
tools.redundant.introduction=Een profiel op hoog niveau kan applicatierechten bevatten of verlenen. Applicatierechten kunnen daarentegen ook lage rechten bevatten of verlenen. Al deze rechten worden over het algemeen rollen genoemd.    Sommige gebruikers kunnen zowel profielen op hoog niveau als applicatierechten of lage rechten hebben gekregen.    In dat geval kunnen lage rollen uit de Soffid-database worden verwijderd, omdat ze worden overgenomen via regels voor rolovername.   Deze tool identificeert alle lage rollen die aan gebruikers zijn toegekend tegelijk met de hoge rol van de eigenaar, en verwijdert deze.
tools.redundant.introduction2=Pas het filter aan om op te schonen voor de lage rechten.
