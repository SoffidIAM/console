tools.disable-accounts.filter=Accounts filteren
tools.disable-accounts.introduction=Er zijn waarschijnlijk accounts die niet meer worden gebruikt. Met deze tool kunt u deze identificeren en actie ondernemen. Het proces bestaat uit twee stappen: 1. Filter de accounts die u wilt analyseren. 2. Selecteer de acties die u op die accounts wilt uitvoeren. Het is gebruikelijk om deze tool in eerste instantie alleen voor een subset van uw accounts te gebruiken. U kunt bijvoorbeeld een bericht sturen wanneer het wachtwoord de vervaldatum nadert, het account deactiveren wanneer er in de afgelopen 90 dagen niet is ingelogd, of het volledig verwijderen wanneer het account 30 dagen is gedeactiveerd.
