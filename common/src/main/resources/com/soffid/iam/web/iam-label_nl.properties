issues.disconnected-system.definition=Dit probleem wordt gemaakt wanneer de Sync Server detecteert dat een doelsysteem offline is
issues.discovered-host.definition=Dit probleem wordt gemaakt wanneer de Sync Server een nieuwe host in het netwerk detecteert. Dit gebeurt alleen nadat het netwerkontdekkingsproces is uitgevoerd.
issues.discovered-system.definition=Dit probleem wordt gemaakt wanneer de Sync Server een nieuw systeem in een host detecteert. Dit gebeurt alleen nadat het netwerkontdekkingsproces is uitgevoerd.
issues.duplicated-user.definition=Het systeem detecteert dat er dubbele gebruikers zijn, of wanneer de taak handmatig wordt gegenereerd door het gebruikersbeheer.
issues.enabled-account-on-disabled-user.definition=Dit probleem wordt gemaakt wanneer een ingeschakeld account wordt gedetecteerd op een gehandicapte gebruiker. Dit kan optreden nadat het verzoeningsproces is uitgevoerd.
issues.failed-job.definition=Dit probleem wordt gemaakt wanneer het systeem functie -mislukkingen detecteert. Dit kan gebeuren door een geplande taak uit te voeren.
issues.global-failed-login.definition=Dit probleem wordt gemaakt wanneer het aantal starten van de sessie de drempel van 0,8 overschrijdt.
issues.integration-errors.definition=Dit probleem wordt gemaakt wanneer de SYNC -server een integratiefout tussen SoffID en een eindsysteem detecteert. U kunt de taak controleren in de monitoring en rapportage.
issues.lockAccount=Bevestig om account %s op %s te vergrendelen
issues.locked-account.definition=Dit probleem wordt gemaakt wanneer een account is geblokkeerd voor het overschrijden van het maximale aantal inlogpogingen. U kunt het eigenschapslot configureren na storingen in de instellingen van het wachtwoordbeleid. Zelfs als het tijdelijk wordt vergrendeld, wordt het incident gegenereerd.
issues.login-different-country.definition=Dit probleem wordt gemaakt wanneer Soffid een nieuwe login van een ander land detecteert. Het werkt alleen met de identiteitsprovider en het is noodzakelijk om de geolocatiedatabase bij te werken.
issues.login-from-new-device.definition=Dit probleem wordt gemaakt wanneer Soffid een nieuwe inloggen van een nieuw apparaat detecteert. Het werkt alleen met de identiteitsprovider.
issues.login-not-recognized.definition=Dit probleem wordt gemaakt wanneer SoffID een inloggen die niet wordt herkend (gehandicapte gebruiker of gebruiker niet bestaat) in de Soffid -console of in Soffid als identiteitsprovider.
issues.noAccount=Er is geen account om te ontgrendelen
issues.noHost=Er is geen host om te vergrendelen
issues.noUser=Er is geen gebruiker om uit te schakelen
issues.otp-failures.definition=Dit probleem wordt gemaakt wanneer een OTP wordt geblokkeerd voor het overschrijden van het aantal pogingen. Momenteel geblokkeerd met 10 mislukte pogingen.
issues.pam-violation.definition=Deze kwestie wordt gemaakt wanneer een van de regels van de PAM wordt geschonden. U kunt de PAM -regels en het PAM -beleid definiëren. Houd er rekening mee dat u de optie "Open probleem" moet controleren in het PAM -beleid dat u wilt beheersen.
issues.password-changed.definition=Dit probleem wordt gemaakt wanneer een wachtwoordwijziging wordt gedetecteerd. Deze wijzigingen komen van het eindsysteem (Active Directory of Soffid OpenLDAP) en Soffid is op de hoogte gebracht. Het probleem wordt niet gemaakt als het de operator of een script is dat het wachtwoord in Soffid verandert.
issues.permissions-granted.definition=Dit probleem wordt gemaakt wanneer wordt vastgesteld dat machtigingen aan een gebruiker op het eindsysteem zijn gegeven. Dit kan optreden nadat het verzoeningsproces is uitgevoerd.
issues.risk-increase.definition=Dit probleem wordt gemaakt wanneer wordt vastgesteld dat machtigingen aan een gebruiker op het eindsysteem zijn gegeven. Dit kan optreden nadat het verzoeningsproces is uitgevoerd.
issues.robot-login.definition=Deze kwestie wordt gemaakt wanneer het wordt gedetecteerd, wordt gedetecteerd dat iemand die de Captcha niet heeft gepasseerd probeert in te loggen bij de identiteitsprovider.
issues.security-exception.definition=Dit probleem wordt gemaakt wanneer ongeautoriseerde toegang tot de console via Webservice of admin -console optreedt.
